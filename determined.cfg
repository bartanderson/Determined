# determined.cfg
# Priority: env var > this file > code default (see determined/config.py).
# Override any value with env vars: DETERMINED_LLM_PROFILE, LLM_FAST_CTX, LLM_QUALITY_CTX

[llm]
# Which llama-server profile this checkout talks to. Profiles are defined in
# determined/agent/llm_client.py (_PROFILES); list them with:
#   python tools/llm_server.py profiles
#   analysis -- Qwen3-VL-8B on port 8081. Determined's own decompose/narrate calls.
#   agent    -- Qwen3.6-35B-A3B on port 8083 (experts on CPU, 32k ctx, --jinja for tool
#               calls). The model a coding agent such as opencode drives.
# Only one profile's server fits in VRAM at a time on the 8 GB card. Manage servers with:
#   python tools/llm_server.py start|stop|status --profile <name>
profile = analysis

# Context budgets used by corpus_synthesis (agent_tools.py) when it packs prompts.
# NOT the server's context size: the server's ctx is set per profile in llm_client.py
# (32768 for both profiles). These two values predate the single-server layout and are
# smaller than the server actually allows; raising them changes how much corpus_synthesis
# packs per pass, so they are left as-is until that is tuned deliberately.
fast_ctx = 16384
quality_ctx = 4096
